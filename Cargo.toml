[package]
name = "agregat"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Thumbnail / compress aggregator API powered by Rumpeg"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.24", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
crossbeam = "0.8"
num_cpus = "1"

# 0.1.4: HEVC (hvc1/hev1) demux + decode. NVENC is Windows-only (enabled below).
imagehash = "0.3.0"

[target.'cfg(windows)'.dependencies]
rumpeg = { version = "0.1.4", features = ["encode-nvenc"] }

[target.'cfg(not(windows))'.dependencies]
rumpeg = { version = "0.1.4" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
rumpeg-format = { path = "vendor/rumpeg-format" }
rumpeg-codec = { path = "vendor/rumpeg-codec" }

